/* Sweettest spring scene — adapted from Snounu's rich-menu motion. */
.spring-stage{perspective:1050px;perspective-origin:50% 50%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.spring-stage.dragging{cursor:grabbing}
.spring-carousel{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.spring-item{position:absolute;left:50%;top:50%;width:80%;max-width:340px;transform-origin:center;will-change:transform,opacity;pointer-events:none}
.spring-item svg{width:100%;display:block;overflow:visible;filter:drop-shadow(0 8px 8px #70533113)}
.dessertstage .spring-item{width:72%;max-width:290px}
.spring-house{position:absolute;left:0;top:0;width:180px;text-align:center;transform-origin:center;will-change:transform,opacity;pointer-events:none}
.spring-house svg{width:100%;display:block;filter:drop-shadow(0 10px 9px #6b482c25)}
.spring-house strong{display:block;font-size:18px;white-space:nowrap}
.spring-house small{display:block;font-size:11px;color:var(--muted)}
.roadstage .arrow-stack{z-index:20}
.fly-sweet{position:fixed;pointer-events:none;z-index:1000;will-change:transform,opacity;transform-origin:center;filter:drop-shadow(0 6px 6px #60472b33)}
.fly-sweet svg{display:block;width:100%;height:100%}
.piece.arrive{animation:piece-arrive .42s cubic-bezier(.2,.85,.25,1.35) both}
@keyframes piece-arrive{0%{transform:scale(.86);opacity:.55}65%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media(max-height:740px){.dessertstage .spring-item{max-width:230px}.spring-house{width:145px}}

/* Full-screen, no document scrolling. Every step is contained in the visual viewport. */
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;background:#e8dfd1}
.app{height:100vh;height:100dvh;min-height:0;max-height:100dvh;width:100%;max-width:480px;overflow:hidden;overscroll-behavior:none;isolation:isolate;padding-top:env(safe-area-inset-top,0px);background:radial-gradient(ellipse at 50% 42%,#fff9ed 0%,#f7f1e6 65%,#efe6d7 100%)}
.steps{position:absolute;top:calc(env(safe-area-inset-top,0px) + 9px);left:50%;transform:translateX(-50%);width:76px;padding:0;gap:4px;z-index:7;pointer-events:none}
.steps i{height:3px;opacity:.8}
.floating-back{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 19px);z-index:8;background:#f7f1e6dc;border-color:#d9cbb6;box-shadow:0 2px 8px #533d2210;width:40px;height:40px}
main{flex:1 1 0;min-height:0;min-width:0;overflow:hidden;padding:clamp(25px,4.6dvh,43px) 18px 8px;gap:clamp(3px,1dvh,9px);animation:none}
main>*{flex-shrink:0;min-width:0}
main>.center:first-child{padding-inline:34px}
h1{font-size:clamp(18px,5.6vw,27px);line-height:1.32;margin:5px 0 3px}
h2{font-size:clamp(17px,4.8vw,23px);line-height:1.3;margin:0 0 3px}
p{line-height:1.45}
.eyebrow{font-size:10px;letter-spacing:.4px}
.hint{font-size:clamp(10px,3.1vw,13px)}
.stage,.roadstage,.dessertstage{flex:1 1 0;min-height:0;width:100%;overflow:hidden;touch-action:none}
.spring-carousel{min-height:0;overflow:visible}
.spring-item,.dessertstage .spring-item{width:var(--art-width,72%);max-width:none}
.spring-house{width:clamp(124px,40vw,178px)}
.spring-house strong{font-size:clamp(13px,4vw,18px);white-space:normal;line-height:1.3}
.spring-house small{font-size:10px}
.arrow-stack{right:0;gap:7px}
.nav{min-height:36px}
.nav .round,.arrow-stack .round{width:36px;height:36px}
.dots{padding:4px 0}
.footer{position:relative;flex:0 0 auto;padding:10px 18px max(10px,env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#f7f1e6ed,#f7f1e6);border-top:1px solid #d8cbb6;box-shadow:0 -5px 20px #63492b08}
.primary,.secondary{min-height:44px;padding:10px 12px;border-radius:12px;font-size:clamp(12px,3.6vw,15px);line-height:1.3}
.primary{box-shadow:0 3px 0 #35231b}
.primary:active,.secondary:active{transform:translateY(2px);box-shadow:none}
.footnote{margin-top:8px;font-size:9px;line-height:1.2}
.buttonrow{gap:8px}
.weight{margin:0;gap:6px}
.weight button{width:38px;height:38px}
.weight output{min-width:80px}
.progress{height:4px;margin:0 auto;width:86%}
.traylabel{margin:0;font-size:11px}
.boxtray{margin:0 auto 3px;width:96%;height:clamp(72px,14dvh,112px);min-height:0;padding:8px;gap:4px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:stretch;align-content:stretch;border-radius:8px 8px 20px 20px;box-shadow:inset 0 0 0 4px #f7ead4,inset 0 0 12px #7c543833,0 4px 0 #b38f68}
.piece{width:auto;height:auto;min-width:0;min-height:0;gap:1px;padding:2px;border-radius:6px;overflow:hidden}
.piece svg{width:100%;height:clamp(20px,4.5dvh,33px)}
.piece b,.piece span{font-size:clamp(8px,2.5vw,11px);white-space:nowrap}
.empty{grid-column:1/-1;align-self:center;padding:0;font-size:11px}
.saved{margin:0;font-size:10px}
.review-art{flex:1 1 0;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.review-art svg{height:100%;width:100%;max-width:290px;object-fit:contain}
.summary{padding:7px 12px;margin:0;border-radius:12px}
.summaryrow{padding:clamp(3px,1dvh,9px) 0;font-size:clamp(11px,3.3vw,14px);line-height:1.25;align-items:center}
.bigprice{font-size:clamp(17px,5vw,23px)}
.notice{font-size:10px;padding:7px 9px;line-height:1.4}
.app[data-step="3"] .footer .secondary{margin-top:7px!important;min-height:37px}
@media(max-height:650px){
 main{padding-top:27px;gap:3px;padding-bottom:6px}
 .floating-back{top:calc(env(safe-area-inset-top,0px) + 14px);width:34px;height:34px}
 .nav{min-height:29px}.nav .round,.arrow-stack .round{width:30px;height:30px}
 .weight button{height:33px;width:33px}
 .footer{padding-top:7px;padding-bottom:max(7px,env(safe-area-inset-bottom,0px))}
 .primary,.secondary{min-height:40px;padding:8px 10px}
 .boxtray{height:72px}
 .footnote{margin-top:5px}
 .summaryrow{padding:4px 0}
 main[data-step="2"]>.center:first-child h2{margin-top:2px!important}
}
@media(max-height:480px){
 main{padding-top:20px;gap:2px;padding-inline:12px}
 .steps{top:calc(env(safe-area-inset-top,0px) + 5px)}
 .floating-back{top:calc(env(safe-area-inset-top,0px) + 8px);width:30px;height:30px}
 h1,h2{font-size:16px}
 .hint,.eyebrow{font-size:9px}
 .boxtray{height:49px;padding:4px}
 .piece{display:grid;grid-template-columns:1fr 1fr;align-content:center;gap:0}
 .piece svg{grid-row:1/3;width:100%;height:24px}
 .piece b,.piece span{font-size:8px}
 .saved{display:none}
 .nav{min-height:25px}.nav .round,.arrow-stack .round{width:25px;height:25px;font-size:16px}
 .weight button{width:28px;height:28px;font-size:18px}
 .footer{padding:5px 12px max(5px,env(safe-area-inset-bottom,0px))}
 .primary,.secondary{min-height:34px;padding:6px 9px}
 .footnote{margin-top:3px;font-size:8px}
 .summaryrow{padding:2px 0;font-size:10px}
 .summary{padding:4px 8px}
 .notice{font-size:9px;padding:4px 6px}
 .app[data-step="3"] .footer .secondary{min-height:28px;margin-top:4px!important}
}
@media(min-width:760px) and (max-height:550px){
 .app{max-width:620px}
 main[data-step="2"]{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto minmax(0,1fr) auto;column-gap:14px}
 main[data-step="2"]>.center:first-child{grid-column:1;grid-row:1;padding:0 24px}
 main[data-step="2"]>.nav{grid-column:1;grid-row:2}
 main[data-step="2"]>.weight{grid-column:1;grid-row:3}
 main[data-step="2"]>.center.hint:not(.saved){grid-column:2;grid-row:1;align-self:end}
 main[data-step="2"]>.progress{grid-column:2;grid-row:2;align-self:center}
 main[data-step="2"]>.dessertstage{grid-column:1;grid-row:4;min-height:0;height:100%}
 main[data-step="2"]>.traylabel{grid-column:2;grid-row:3;align-self:center}
 main[data-step="2"]>.boxtray{grid-column:2;grid-row:4;height:100%;margin:0;align-self:stretch}
 main[data-step="2"]>.saved{grid-column:1/-1;grid-row:5}
}

/* Refined confectionery materials and tactile controls. */
:root{--ink:#39271e;--muted:#806c58;--gold:#b58a50;--line:#dfd0ba;--dark:#51382b}
.app{background:radial-gradient(ellipse at 50% 36%,#fffaf0 0%,#f8f0e2 56%,#e9dcc6 100%)}
.eyebrow{letter-spacing:.8px;font-weight:700;color:#9a703e}
h1,h2{font-weight:700;color:#453025}
.round,.weight button{background:linear-gradient(150deg,#fffaf1,#eee1ce);border-color:#d3bea1;box-shadow:0 2px 3px #69482b15,inset 0 1px 0 #fffaf2}
.round:active,.weight button:active{transform:scale(.93)}
.primary{background:linear-gradient(155deg,#74503b,#4d3024);border:1px solid #7b5b42;box-shadow:0 3px 0 #38251c,inset 0 1px 0 #c29a6266;color:#fff5e1}
.secondary{background:linear-gradient(155deg,#fff9ed,#f0e4d0);border:1px solid #ba9a70;color:#62442d}
.weight{gap:7px}
.weight output{background:#fff8ea88;border:1px solid #d9c5a8;border-radius:9px;padding:7px 8px;color:#5d412e}
.weight button[data-act="plus"]{background:linear-gradient(155deg,#735039,#503427);border-color:#78553c;color:#fff8e7}
.progress{background:#e4d3b9;box-shadow:inset 0 1px 2px #8a684622}
.progress i{background:linear-gradient(90deg,#d9b36f,#a7783c)}
.spring-item svg,.spring-house svg{filter:drop-shadow(0 4px 5px #573a2010)}
.boxtray{background:linear-gradient(155deg,#cba87c 0%,#f4e3c6 28%,#e4c69b 72%,#c4a075 100%);border-color:#a58055;box-shadow:inset 0 0 0 5px #f6e5c9,inset 0 0 0 6px #c4a173,inset 0 7px 12px #815c3333,0 4px 0 #ad875b}
.piece{background:linear-gradient(155deg,#fff8e7c9,#f4e5ce50);border:1px solid #ae8a5d44;color:#5d422d;box-shadow:0 1px 2px #69482910}
.piece svg{filter:drop-shadow(0 2px 1px #6f49252b)}
.traylabel b{color:#6b4a31}
.summary{background:#fffaf1ba;border-color:#d9c5a8}
@media(max-height:480px){.weight output{padding:3px 5px}}

.steps{width:112px}
.checkout-options{display:grid;gap:clamp(5px,1.2dvh,11px);margin-top:clamp(4px,1.4dvh,14px)}
.checkout-choice{display:flex;align-items:center;text-align:right;gap:10px;width:100%;padding:clamp(7px,1.5dvh,15px) 11px;border:1px solid #d8c4a6;background:#fffaf0b0;border-radius:13px;min-height:0}
.checkout-choice.chosen{border-color:#a47b45;background:#f3e4c8;box-shadow:inset 0 0 0 1px #b58a5050}
.choice-icon{display:grid;place-items:center;width:42px;height:42px;flex:none;border-radius:12px;background:#eee0c9;color:#85603b}
.chosen .choice-icon{background:#dfc59b;color:#664426}
.choice-copy{flex:1;display:grid;gap:4px;min-width:0}
.choice-copy b{font-size:clamp(12px,3.9vw,16px)}
.choice-copy small{font-size:clamp(9px,2.9vw,12px);color:var(--muted)}
.choice-radio{width:19px;height:19px;border:1px solid #b69a75;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;font-size:12px}
.chosen .choice-radio{background:#946c3e;border-color:#946c3e}
.checkout-panel{background:#fff9edac;border:1px solid #ddc9ad;border-radius:13px;padding:clamp(8px,1.6dvh,15px);display:grid;gap:6px;font-size:13px}
.checkout-panel>b{font-size:13px}
.chips{display:flex;gap:5px}
.chip{flex:1;padding:8px 3px;border:1px solid #dac5a6;background:#fff9ed;border-radius:8px;font-size:clamp(9px,3vw,12px)}
.chip.chosen{background:#5c3d2e;color:#fff5e2;border-color:#5c3d2e}
.checkout-spacer{flex:1 1 0;min-height:0}
.checkout-secondary{margin-top:7px;min-height:36px}
.demo-account{background:#f1e4cd;border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;gap:5px;align-items:center;font-size:11px}
.demo-account b{direction:ltr;color:#735339}
.proof-button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:36px;border:1px dashed #b18b58;border-radius:8px;background:#fff8e9;font-size:12px}
.proof-button.verified{background:#e8eee2;border-color:#80916c;color:#426246}
.order-success{width:clamp(38px,8dvh,66px);height:clamp(38px,8dvh,66px);margin:5px auto 3px;background:#e8d6b4;border:1px solid #c9a66d;border-radius:50%;display:grid;place-items:center;color:#795634}
.order-success svg{width:55%;height:55%}
.timeline{padding:3px 10px;margin-top:3px;display:grid;gap:clamp(2px,.7dvh,6px)}
.timeline-item{display:flex;align-items:center;gap:9px;min-height:clamp(30px,5.4dvh,46px);position:relative}
.timeline-item:not(:last-child):after{content:"";position:absolute;right:13px;top:calc(50% + 13px);height:calc(50% - 8px);width:1px;background:#cbb799}
.timeline-item i{font-style:normal;border-radius:50%;width:27px;height:27px;display:grid;place-items:center;border:1px solid #cbb799;color:#97826a;font-size:11px;flex:none;background:#f6ecdb}
.timeline-item.reached i{background:#9b753f;color:white;border-color:#9b753f}
.timeline-item.current i{box-shadow:0 0 0 3px #dcc59b80}
.timeline-item div{display:grid;gap:1px;color:#a2907a}
.timeline-item.reached div{color:var(--ink)}
.timeline-item b{font-size:clamp(11px,3.6vw,14px)}
.timeline-item span{font-size:10px;color:var(--muted)}
#receipt-dialog{width:min(92vw,420px);max-height:90dvh;overflow:auto;color:var(--ink);background:#fbf2e4;border:1px solid #b99a70;border-radius:18px;padding:16px}
