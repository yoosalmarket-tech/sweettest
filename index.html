<style>

px;text-align:center;transition:transform .3s,opacity .3s}.house.active{width:180px;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2}.house.prev{left:11%;top:4%;opacity:.42;transform:scale(.8)}.house.next{right:8%;bottom:1%;opacity:.42;transform:scale(.8)}.house svg{width:100%;filter:drop-shadow(0 10px 9px #6b482c25)}.house small{display:block;font-size:11px;color:var(--muted)}.house strong{font-size:16px;display:block;white-space:nowrap}.house.active strong{font-size:19px}.open{color:#38744d;font-size:12px}.closed{color:#a95142;font-size:12px}.arrow-stack{position:absolute;right:0;top:50%;transform:translateY(-50%);display:grid;gap:10px;z-index:4}.arrow-stack button{background:#f7f1e6ee}.footer{position:sticky;bottom:0;background:var(--cream);padding:14px 22px max(16px,env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:5}.primary{border:none;background:var(--dark);color:#fff;border-radius:13px;padding:15px 20px;min-height:52px;width:100%;font-weight:bold;box-shadow:0 4px 0 #35231b}.secondary{border:1px solid var(--dark);border-radius:13px;background:none;padding:13px 12px;min-height:50px;width:100%;font-weight:bold}.buttonrow{display:flex;gap:10px}.footnote{text-align:center;font-size:10px;color:var(--muted);margin-top:12px}.footnote a{color:inherit;text-decoration:none}.carousel{display:flex;align-items:center;justify-content:center;position:relative;min-height:290px;width:100%;overflow:visible}.neighbor{position:absolute;width:57%;opacity:.35;pointer-events:none;transform:scale(.65);filter:saturate(.7)}.neighbor.prev{right:-36%}.neighbor.next{left:-36%}.hero{width:80%;z-index:1;animation:appear .25s ease}.hero svg{width:100%;display:block;overflow:visible}.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}.nav .round{background:#f7f1e6e8}.dots{display:flex;justify-content:center;gap:6px;padding:14px 0}.dots span{width:6px;height:6px;border-radius:10px;background:var(--line)}.dots span.on{width:20px;background:va /* Sweettest spring scene — adapted from Snounu's rich-menu motion. */
.spring-stage{perspective:1050px;perspective-origin:50% 50%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.spring-stage.dragging{cursor:grabbing}
.spring-carousel{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.spring-item{position:absolute;left:50%;top:50%;width:80%;max-width:340px;transform-origin:center;will-change:transform,opacity;pointer-events:none}
.spring-item svg{width:100%;display:block;overflow:visible;filter:drop-shadow(0 8px 8px #70533113)}
.dessertstage .spring-item{width:72%;max-width:290px}
.spring-house{position:absolute;left:0;top:0;width:180px;text-align:center;transform-origin:center;will-change:transform,opacity;pointer-events:none}
.spring-house svg{width:100%;display:block;filter:drop-shadow(0 10px 9px #6b482c25)}
.spring-house strong{display:block;font-size:18px;white-space:nowrap}
.spring-house small{display:block;font-size:11px;color:var(--muted)}
.roadstage .arrow-stack{z-index:20}
.fly-sweet{position:fixed;pointer-events:none;z-index:1000;will-change:transform,opacity;transform-origin:center;filter:drop-shadow(0 6px 6px #60472b33)}
.fly-sweet svg{display:block;width:100%;height:100%}
.piece.arrive{animation:piece-arrive .42s cubic-bezier(.2,.85,.25,1.35) both}
@keyframes piece-arrive{0%{transform:scale(.86);opacity:.55}65%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media(max-height:740px){.dessertstage .spring-item{max-width:230px}.spring-house{width:145px}}

<script>

const money=n=>fmt(n)+" ₪", capacity=()=>data.boxes[box].capacity;
function home(active){return '<svg viewBox="0 0 180 150" aria-hidden="true"><path d="M20 57 90 10 160 57" fill="#b38e63" stroke="#67482f" stroke-width="2"/><path d="M35 53h110v83H35z" fill="#f4e2c5" stroke="#8b6745" stroke-width="2"/><path d="M26 58 90 16 154 58z" fill="#d5b58a" stroke="#8b6745"/><path d="M45 65h90v17H45z" fill="#6f4b37"/><path d="M50 90h28v30H50zM102 90h28v30h-28z" fill="#cab79d" stroke="#8b6745"/><path d="M80 88h20v48H80z" fill="#8f6a4d"/><path d="M34 136h112" stroke="#8b6745" stroke-width="3"/><text x="90" y="77" text-anchor="middle" font-size="9" fill="#fff5dc">حلويات</text></svg>'}
function boxArt(kind){if(kind==="plate")return '<svg viewBox="0 0 320 220" aria-hidden="true"><ellipse cx="160" cy="150" rx="131" ry="48" fill="#765c3b20"/><ellipse cx="160" cy="117" rx="135" ry="64" fill="#b9a78b"/><ellipse cx="160" cy="108" rx="135" ry="62" fill="#fff9ee" stroke="#9e865f" stroke-width="2"/><ellipse cx="160" cy="108" rx="99" ry="40" fill="#efe6d5" stroke="#ccbc9c"/></svg>';return '<svg viewBox="0 0 320 220" aria-hidden="true"><ellipse cx="160" cy="174" rx="131" ry="25" fill="#75543222"/><path d="M35 103 165 45 286 81 155 148z" fill="#e6cda5" stroke="#9f7a4b" stroke-width="2"/><path d="M35 103v35l120 51v-41z" fill="#bc9567" stroke="#9f7a4b" stroke-width="2"/><path d="M155 148v41l131-67V81z" fill="#a68055" stroke="#9f7a4b" stroke-width="2"/><path d="M35 96 165 38 286 74 155 141z" fill="#f6e5c9" stroke="#9f7a4b" stroke-width="2"/><path d="m55 95 109-48 104 31-113 54z" fill="none" stroke="#c0a275"/><path d="m35 96 120 45v9L35 105z" fill="#d4b58a"/><text x="160" y="98" fill="#80613f" font-size="18" font-family="Georgia" text-anchor="middle" transform="rotate(-7 160 98)">SWEETS</text></svg>'}
function dessert(kind){let color=kind==="kunafa"?"#eeb541":kind==="arabic"?"#ae6e3a":kind==="baklava"?"#cb953f":"#dca450",dark=kind==="kunafa"?"#b5742e":"#995e30";let nuts=Array.from({length:40},(_,i)=>{let a=i*2.39996,r=Math.sqrt((i+1)/40),x=160+Math.cos(a)*101*r,y=93+Math.sin(a)*34*r;return '<ellipse cx="'+x+'" cy="'+y+'" rx="'+(2+i%3)+'" ry="1.7" fill="'+(i%3===0?"#526034":"#a78541")+'" transform="rotate('+i*29+' '+x+' '+y+')"/>'}).join("");let cuts=kind==="kunafa"?"":'<path d="M65 78 235 109M55 98 216 127M106 60 93 123M157 56 145 132M208 62 196 130" stroke="#8b592e" stroke-width="1.7" opacity=".7"/>';return '<svg viewBox="0 0 320 174" aria-hidden="true"><ellipse cx="160" cy="145" rx="126" ry="22" fill="#76563824"/><ellipse cx="160" cy="119" rx="140" ry="48" fill="#cabda8"/><ellipse cx="160" cy="111" rx="140" ry="48" fill="#fffaf1" stroke="#b6a48a" stroke-width="1.5"/><path d="M43 93v19a117 42 0 0 0 234 0V93" fill="'+dark+'"/><ellipse cx="160" cy="93" rx="117" ry="42" fill="'+color+'" stroke="#a76d32"/><ellipse cx="160" cy="91" rx="108" ry="36" fill="#ffda75" opacity=".33"/>'+cuts+nuts+'</svg>'}

function nav(i,n){return '<div class="nav"><button class="round" data-act="prev" aria-label="السابق">‹</button>'+dots(n,i)+'<button class="round" data-act="next" aria-label="التالي">›</button></div>'}
function primary(label,act,disabled=false){return '<button class="primary" data-act="'+act+'" '+(disabled?'disabled':'')+'>'+label+'</button>'}
function draw(){document.getElementById("steps").innerHTML=[0,1,2,3].map(i=>'<i class="'+(i<=step?"on":"")+'"></i>').join("");back.style.visibility=step?"visible":"hidden";let b=data.branches[branch], bx=data.boxes[box], s=data.sweets[sweet];
if(step===0){let houses=[-1,0,1].map(d=>{let x=data.branches[wrap(branch+d,data.branches.length)];return '<div class="house '+(d===0?'active':d<0?'prev':'next')+'" '+(d?'data-act="'+(d<0?'prev':'next')+'" role="button" tabindex="0"':'')+'>'+home(d===0)+'<strong>'+esc(x.name)+'</strong><span class="'+(x.open?'open':'closed')+'">'+(x.open?'مفتوح':'مغلق')+'</span><small>'+esc(x.note)+'</small></div>'}).join("");main.innerHTML='<div class="center"><div class="eyebrow">٠١ — اختر الفرع</div><h1>من وين بتحب نجهّز طلبك؟</h1><p class="hint">اسحب للأعلى أو للأسفل لاختيار الفرع</p></div><div class="stage roadstage" data-swipe="vertical"><svg class="road" viewBox="0 0 360 410" preserveAspectRatio="none"><path d="M74 0 C290 55 338 86 164 167 S17 236 212 302 265 373 93 410" fill="none" stroke="#dfc9a7" stroke-width="34"/><path d="M74 0 C290 55 338 86 164 167 S17 236 212 302 265 373 93 410" fill="none" stroke="#fbf0d8" stroke-width="25"/><path d="M74 0 C290 55 338 86 164 167 S17 236 212 302 265 373 93 410" fill="none" stroke="#bc9d73" stroke-width="1.2" stroke-dasharray="6 7"/></svg>'+houses+'<div class="arrow-stack"><button class="round" data-act="prev" aria-label="فرع سابق">↑</button><button class="round" data-act="next" aria-label="فرع تالي">↓</button></div></div>';footer.innerHTML=primary(b.open?'اختيار الفرع':'الفرع مغلق حالياً','continue',!b.open)}
if(step===1){main.innerHTML='<div class="center"><div class="eyebrow">٠٢ — اختر البوكس</div><h1>ضيافتك على ذوقك</h1><p class="hint">'+esc(b.name)+' · اسحب يميناً أو يساراً</p></div><div class="stage" data-swipe="horizontal"><div class="carousel"><div class="neighbor prev">'+boxArt(data.boxes[wrap(box-1,data.boxes.length)].kind)+'</div><div class="hero">'+boxArt(bx.kind)+'</div><div class="neighbor next">'+boxArt(data.boxes[wrap(box+1,data.boxes.length)].kind)+'</div></div></div>'+nav(box,data.boxes.length)+'<div class="center"><h2>'+esc(bx.name)+'</h2><p class="hint">يكفي تقريباً '+fmt(bx.capacity)+' كيلو حلويات</p></div>';footer.innerHTML='<div class="buttonrow">'+primary("اختر تشكيلة جاهزة","preset")+'<button class="secondary" data-act="custom">خصص المحتويات</button></div>'}
if(step===2){let q=amounts[sweet]||0;let pieces=Object.entries(amounts).filter(([i,v])=>v>0).map(([i,v])=>'<div class="piece" data-index="'+i+'">'+dessert(data.sweets[i].kind)+'<b>'+esc(data.sweets[i].name)+'</b><span>'+fmt(v)+' كغ</span></div>').join("");main.innerHTML='<div class="center"><div class="eyebrow">٠٣ — شكّل البوكس</div><h2 style="margin-top:8px">'+esc(s.name)+'</h2><p class="hint">'+esc(s.desc)+' · '+money(s.price)+' / كيلو</p></div>'+nav(sweet,data.sweets.length)+'<div class="weight"><button data-act="remove" aria-label="حذف النوع" '+(!q?'disabled':'')+'>×</button><button data-act="minus" aria-label="إنقاص نصف كيلو" '+(!q?'disabled':'')+'>−</button><output>'+fmt(q)+' كيلو</output><button data-act="plus" aria-label="إضافة نصف كيلو" '+(kg()+.5>capacity()?'disabled':'')+'>+</button></div><div class="center hint">'+fmt(kg())+' / '+fmt(capacity())+' كيلو</div><div class="progress"><i style="width:'+Math.min(100,kg()/capacity()*100)+'%"></i></div><div class="stage dessertstage" data-swipe="horizontal"><div class="carousel"><div class="neighbor prev">'+dessert(data.sweets[wrap(sweet-1,data.sweets.length)].kind)+'</div><div class="hero">'+dessert(s.kind)+'</div><div class="neighbor next">'+dessert(data.sweets[wrap(sweet+1,data.sweets.length)].kind)+'</div></div></div><div class="traylabel"><b>'+esc(bx.name)+'</b><span>تشكيلتك</span></div><div class="boxtray">'+(pieces||'<div class="empty">أضف الحلو من الزر + لتعبئة البوكس</div>')+'</div><p class="hint center saved" style="margin-top:14px">تُحفظ تشكيلتك تلقائياً على هذا الجهاز</p>';footer.innerHTML=primary('<span class="orderbtn"><span>اطلب البوكس</span><span>'+money(total())+'</span></span>','review',kg()===0)}
if(step===3){main.innerHTML='<div class="center"><div class="eyebrow">٠٤ — مراجعة الطلب</div><h1>بوكس على ذوقك ✦</h1><p class="hint">'+esc(b.name)+' · '+esc(bx.name)+'</p></div><div style="width:65%;margin:15px auto">'+boxArt(bx.kind)+'</div><div class="summary">'+Object.entries(amounts).filter(([i,v])=>v>0).map(([i,v])=>'<div class="summaryrow"><span>'+esc(data.sweets[i].name)+' · '+fmt(v)+' كغ</span><b>'+money(data.sweets[i].price*v)+'</b></div>').join("")+'<div class="summaryrow"><span>الوزن الكلي</span><b>'+fmt(kg())+' كغ</b></div><div class="summaryrow"><b>المجموع</b><span class="bigprice">'+money(total())+'</span></div></div><div class="notice">هذا نموذج تجريبي. الفروع والأسعار افتراضية ولا يتم إرسال طلب حقيقي أو تحصيل أي دفعة.</div>';footer.innerHTML=primary(saved?'تم حفظ التشكيلة ✓':'احفظ تشكيلتك','save')+'<button class="secondary" style="margin-top:9px" data-act="restart">ابدأ من جديد</button>'}
footer.insertAdjacentHTML("beforeend",'<div class="footnote"><a href="https://yoosal.net" target="_blank" rel="noopener">تطوير وكالة يوصل · YOOSAL</a></div>');mountSpring()}
function persist(){try{localStorage.setItem("sweettest:v1",JSON.stringify({branch,box,sweet,amounts}))}catch{}}
function baseAction(a){touched=true;saved=false;if(a==="prev"||a==="next"){let d=a==="next"?1:-1;if(step===0)branch=wrap(branch+d,data.branches.length);if(step===1){box=wrap(box+d,data.boxes.length);amounts={}}if(step===2)sweet=wrap(sweet+d,data.sweets.length)}
else if(a==="continue"&&step===0&&data.branches[branch].open)step=1;
else if(a==="custom"&&step===1)step=2;
else if(a==="preset"&&step===1){amounts={};for(let k=0;k<Math.round(capacity()*2);k++){let i=k%data.sweets.length;amounts[i]=(amounts[i]||0)+.5}step=2}
else if(a==="plus"&&step===2&&kg()+.5<=capacity())amounts[sweet]=(amounts[sweet]||0)+.5;
else if(a==="minus"&&step===2)amounts[sweet]=Math.max(0,(amounts[sweet]||0)-.5);
else if(a==="remove"&&step===2)delete amounts[sweet];
else if(a==="review"&&step===2&&kg()>0)step=3;
else if(a==="save"&&step===3){persist();saved=true}
else if(a==="restart"){step=0;branch=box=sweet=0;amounts={}}
else if(a==="back"&&step>0)step--;
persist();draw()}
document.addEventListener("click",e=>{let el=e.target.closest("[data-act]");if(el&&!el.disabled)action(el.dataset.act)});back.addEventListener("click",()=>action("back"));document.addEventListener("keydown",e=>{if(e.target.matches('[role="button"][data-act]')&&(e.key==="Enter"||e.key===" ")){e.preventDefault();action(e.target.dataset.act)}else if(e.key==="ArrowLeft"&&step>0&&step<3)action("next");else if(e.key==="ArrowRight"&&step>0&&step<3)action("prev");else if(e.key==="ArrowUp"&&step===0)action("next");else if(e.key==="ArrowDown"&&step===0)action("prev")});

const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)");
let scene=null, pointer=null, raf=0, lastTime=0, suppress=0;
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
const selected=()=>step===0?branch:step===1?box:sweet;
const catalog=()=>step===0?data.branches:step===1?data.boxes:data.sweets;
function stopSpring(){if(raf)cancelAnimationFrame(raf);raf=0;lastTime=0;pointer=null;scene=null}
function mountSpring(){
 stopSpring();
 if(step>2)return;
 const stage=main.querySelector("[data-swipe]");if(!stage)return;
 stage.classList.add("spring-stage");
 const vertical=step===0, items=catalog(), k=selected();
 let layer, path=null;
 if(vertical){
  stage.querySelectorAll(".house").forEach(el=>el.remove());
  path=stage.querySelector(".road path:last-child");
  layer=document.createElement("div");layer.className="spring-carousel";
  stage.insertBefore(layer,stage.querySelector(".arrow-stack"));
 }else{
  layer=stage.querySelector(".carousel");layer.className="spring-carousel";
 }
 layer.innerHTML=items.map((x,i)=>vertical?'<div class="spring-house" data-index="'+i+'">'+home(i===k)+'<strong>'+esc(x.name)+'</strong><span class="'+(x.open?"open":"closed")+'">'+(x.open?"مفتوح":"مغلق")+'</span><small>'+esc(x.note)+'</small></div>':'<div class="spring-item" data-index="'+i+'">'+(step===1?boxArt(x.kind):dessert(x.kind))+'</div>').join("");
 scene={stage,layer,path,vertical,items,els:[...layer.children],k,target:k,velocity:0,step};
 paintSpring();
}
function paintSpring(){
 const s=scene;if(!s)return;
 const w=s.stage.clientWidth,h=s.stage.clientHeight,side=clamp(w*.44,92,255);
 s.els.forEach((el,i)=>{
  let dif=i-s.k,d=Math.abs(dif),sign=Math.sign(dif);
  el.style.visibility=d>2.4?"hidden":"visible";
  el.style.opacity=String(d<=1?1-d*.30:d<=2?.70-(d-1)*.42:Math.max(0,.28-(d-2)*.28));
  el.style.zIndex=String(Math.round(1000-d*100));
  if(s.vertical&&s.path){
   let p=s.path.getPointAtLength(s.path.getTotalLength()*clamp(.49+dif*.35,-.0,1));
   let x=p.x/360*w,y=p.y/410*h;
   let scale=1-.29*Math.min(d,1.8);
   el.style.transform="translate3d("+x.toFixed(1)+"px,"+y.toFixed(1)+"px,0) translate(-50%,-50%) rotateZ("+clamp(s.velocity*10,-5,5)+"deg) scale("+scale+")";
  }else{
   let x=sign*Math.min(d,1.25)*side,y=Math.min(d,2.5)*18,z=-Math.min(d,3)*240;
   el.style.transform="translate(-50%,-50%) translate3d("+x.toFixed(1)+"px,"+y.toFixed(1)+"px,"+z.toFixed(1)+"px) rotateX("+clamp(-s.velocity*25,-8,8)+"deg) rotateY("+(sign*Math.min(d,1.5)*9)+"deg) rotateZ("+(-sign*Math.min(d,2)*2.8)+"deg) scale("+(1-.13*Math.min(d,1))+")";
  }
 });
}
function commitSelection(index){
 let i=clamp(Math.round(index),0,catalog().length-1), old=selected();
 if(i===old){if(scene){scene.k=i;scene.target=i;scene.velocity=0;paintSpring()}return}
 touched=true;saved=false;
 if(step===0)branch=i;
 else if(step===1){box=i;amounts={}}
 else if(step===2)sweet=i;
 persist();draw();
}
function tickSpring(now){
 raf=0;const s=scene;if(!s)return;
 let dt=clamp((now-(lastTime||now))/16.67,.5,3);lastTime=now;
 if(!pointer||!pointer.axis){
  s.velocity+=(s.target-s.k)*.07*dt;
  s.velocity*=Math.pow(.8,dt);
  s.k+=s.velocity*dt;
  if(s.k<-.42){s.k=-.42;s.velocity=Math.max(0,s.velocity)}
  if(s.k>s.items.length-1+.42){s.k=s.items.length-1+.42;s.velocity=Math.min(0,s.velocity)}
 }
 paintSpring();
 if(!pointer&&Math.abs(s.k-s.target)<.002&&Math.abs(s.velocity)<.002){
  s.k=s.target;s.velocity=0;lastTime=0;paintSpring();commitSelection(s.target);return;
 }
 raf=requestAnimationFrame(tickSpring);
}
function runSpring(){if(!raf){lastTime=0;raf=requestAnimationFrame(tickSpring)}}
function navigate(delta){
 if(!scene||pointer)return;
 const s=scene,next=s.target+delta;
 s.target=clamp(next,0,s.items.length-1);
 if(reduceMotion.matches){commitSelection(s.target);return}
 if(next!==s.target)s.velocity=delta*.12;
 runSpring();
}
function flySweet(source){
 if(reduceMotion.matches||!source)return;
 const target=main.querySelector(".boxtray .piece[data-index='"+sweet+"']")||main.querySelector(".boxtray .piece:last-child");
 if(!target)return;
 const to=target.getBoundingClientRect();
 const el=document.createElement("div");el.className="fly-sweet";el.innerHTML=dessert(data.sweets[sweet].kind);
 const w=source.width*.48,h=source.height*.48,x=source.left+(source.width-w)/2,y=source.top+(source.height-h)/2;
 Object.assign(el.style,{left:x+"px",top:y+"px",width:w+"px",height:h+"px"});document.body.appendChild(el);
 const dx=to.left+to.width/2-x-w/2,dy=to.top+to.height/2-y-h/2;
 const anim=el.animate([{transform:"translate3d(0,0,0) scale(1)",opacity:1},{transform:"translate3d("+dx*.32+"px,"+(dy*.18-14)+"px,0) scale(.86)",opacity:1,offset:.28},{transform:"translate3d("+dx+"px,"+dy+"px,0) scale(.35)",opacity:.15}],{duration:620,easing:"cubic-bezier(.22,.65,.3,1)"});
 const remove=()=>el.remove();anim.onfinish=remove;anim.oncancel=remove;
 target.classList.add("arrive");
}
function action(a){
 if(a==="prev"||a==="next"){navigate(a==="next"?1:-1);return}
 if(pointer)return;
 if(scene&&Math.round(scene.target)!==selected())commitSelection(scene.target);
 const from=a==="plus"&&step===2&&kg()+.5<=capacity()&&scene?scene.els[sweet]?.getBoundingClientRect():null;
 const before=step,old=kg();
 baseAction(a);
 if(from&&kg()>old)flySweet(from);
 if(before!==step&&!reduceMotion.matches){
  main.animate([{opacity:0,transform:"translateY("+(step>before?14:-14)+"px)"},{opacity:1,transform:"translateY(0)"}],{duration:310,easing:"cubic-bezier(.2,.8,.2,1)"});
 }
}
main.addEventListener("pointerdown",e=>{
 const s=scene;if(!s||pointer||e.button!==0||e.isPrimary===false||e.target.closest("button,a,input"))return;
 if(!e.target.closest("[data-swipe]"))return;
 touched=true;
 pointer={id:e.pointerId,x:e.clientX,y:e.clientY,k:s.k,from:s.target,last:performance.now(),axis:false,rejected:false};
 s.stage.setPointerCapture?.(e.pointerId);s.stage.classList.add("dragging");
 s.velocity=0;runSpring();
});
main.addEventListener("pointermove",e=>{
 const p=pointer,s=scene;if(!p||!s||p.id!==e.pointerId||p.rejected)return;
 const dx=e.clientX-p.x,dy=e.clientY-p.y,primary=s.vertical?dy:dx,cross=s.vertical?dx:dy;
 if(!p.axis){if(Math.hypot(dx,dy)<8)return;if(Math.abs(cross)>Math.abs(primary)){p.rejected=true;return}p.axis=true}
 const raw=p.k-primary/(s.vertical?Math.max(110,s.stage.clientHeight*.36):160);
 const max=s.items.length-1,elastic=raw<0?raw*.32:raw>max?max+(raw-max)*.32:raw;
 const val=clamp(elastic,-.42,max+.42),now=performance.now(),dt=Math.max((now-p.last)/16.67,.5);
 s.velocity=s.velocity*.5+(val-s.k)/dt*.5;s.k=val;p.last=now;paintSpring();
});
function release(e,canceled=false){
 const p=pointer,s=scene;if(!p||!s||p.id!==e.pointerId)return;
 pointer=null;s.stage.classList.remove("dragging");
 if(s.stage.hasPointerCapture?.(p.id))s.stage.releasePointerCapture(p.id);
 if(p.axis&&!canceled){
  suppress=Date.now()+300;
  const delta=s.vertical?e.clientY-p.y:e.clientX-p.x;
  const momentum=performance.now()-p.last>110?0:s.velocity;
  let dest=Math.round(s.k+momentum*7);
  if(Math.abs(delta)>=45&&dest===p.from)dest=p.from+(delta<0?1:-1);
  s.target=clamp(dest,0,s.items.length-1);
 }else{s.target=p.from;s.velocity=0}
 if(reduceMotion.matches){commitSelection(s.target);return}
 runSpring();
}
main.addEventListener("pointerup",e=>release(e));main.addEventListener("pointercancel",e=>release(e,true));
main.addEventListener("lostpointercapture",e=>release(e,true));
main.addEventListener("click",e=>{if(Date.now()<suppress){e.preventDefault();e.stopPropagation()}},true);
window.addEventListener("resize",()=>paintSpring(),{passive:true});
function restore(){try{let p=JSON.parse(localStorage.getItem("sweettest:v1"));if(p&&Number.isInteger(p.branch)&&Number.isInteger(p.box)&&Number.isInteger(p.sweet)&&p.branch>=0&&p.branch<data.branches.length&&p.box>=0&&p.box<data.boxes.length&&p.sweet>=0&&p.sweet<data.sweets.length){branch=p.branch;box=p.box;sweet=p.sweet;amounts={};for(let [i,v] of Object.entries(p.amounts||{})){if(data.sweets[i]&&Number.isFinite(v)&&v>=0&&v%0.5===0&&kg()+v<=capacity())amounts[i]=v}}}catch{}}
restore();draw();
const key="sb_publishable_bci0EdNv53nVc8F_GaG47w_-cV2Dl9o";fetch("https://xdmdknysnwxcygxvhxav.supabase.co/rest/v1/sweet_catalog?id=eq.demo&select=data",{headers:{apikey:key},signal:AbortSignal.timeout(4500)}).then(r=>{if(!r.ok)throw Error("catalog");return r.json()}).then(rows=>{let d=rows[0]?.data;if(!touched&&d&&d.branches?.length&&d.boxes?.length&&d.sweets?.length){data=d;branch=box=sweet=0;amounts={};restore();draw()}}).catch(()=>{});
</script></body></html>
